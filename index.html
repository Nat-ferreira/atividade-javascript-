<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Alterar Cor da Página</title>
</head>

<body>

    <h1>Alterar a cor da página</h1>

    <p>Clique no botão para deixar a página azul.</p>

    <button onclick="mudarCor()">
        Deixar página azul
    </button>

    <script>
        function mudarCor() {
            document.body.style.backgroundColor = "blue";
        }
    </script>

</body>

</html>
